# Full stack locally, with the same image as production:  docker compose up --build
# Open http://localhost:8080
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: calendar
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The app image from the root Dockerfile: migrates the database on start,
  # then serves the API and the frontend on $PORT.
  app:
    build: .
    image: calendar-app
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql+psycopg://calendar:calendar@db:5432/calendar
      # The local stack is plain HTTP; production (HTTPS) keeps the default (true).
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
