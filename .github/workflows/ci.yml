# Project CI: lint, tests, API-contract check, Docker smoke test.
# (hexlet-check.yml is Hexlet's own workflow; leave it untouched.)
name: ci

on:
  # Every push to any branch. PRs from this repo are covered by the push run,
  # so there is no separate pull_request trigger (it would run everything twice).
  push:
    branches: ['**']
  workflow_dispatch: # "Run workflow" button in the Actions tab

# A newer push to the same branch cancels the still-running older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Fails if someone changed the API but forgot `make api-client`.
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.9.26"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --locked
      - run: cd frontend && npm ci
      - run: make api-client
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/api/generated

  # Builds the production images and checks the whole stack actually starts.
  docker:
    needs: [backend, frontend, api-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --wait
      - run: curl --fail --silent http://localhost:8080/api/health/ready
      - run: curl --fail --silent http://localhost:8080/ | grep -q '<div id="root">'
      - if: failure()
        run: docker compose logs
